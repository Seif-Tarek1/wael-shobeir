<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--
    'unsafe-inline' for scripts is required only because Capacitor injects its native
    bridge as an inline <script> on older Android WebViews. The app never renders
    untrusted HTML (all user text goes through textContent) and makes no network calls.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F6F3EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1613" media="(prefers-color-scheme: dark)">
  <title>اللواء وائل شوبير</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="emblem" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2.8l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.6 6.6 19.5l1.1-6.1-4.5-4.2 6.1-.8z"/></svg>
        </div>
        <div class="brand-text">
          <h1>اللواء وائل شوبير</h1>
          <p class="greeting" id="greeting"></p>
        </div>
      </div>
      <button type="button" class="today-btn" id="todayBtn">اليوم</button>
    </header>

    <div class="banner" id="banner" role="status" hidden>
      <p id="bannerText"></p>
      <button type="button" class="banner-btn" id="bannerBtn"></button>
    </div>

    <main>
      <section class="card calendar" aria-label="التقويم">
        <div class="month-bar">
          <button type="button" class="icon-btn" id="prevMonth" aria-label="الشهر السابق">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          </button>
          <div class="month-title">
            <h2 id="monthTitle"></h2>
            <p id="hijriTitle" class="hijri"></p>
          </div>
          <button type="button" class="icon-btn" id="nextMonth" aria-label="الشهر التالي">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
        </div>
        <div class="weekdays" aria-hidden="true">
          <span>سبت</span><span>أحد</span><span>اثنين</span><span>ثلاثاء</span><span>أربعاء</span><span>خميس</span><span class="weekend">جمعة</span>
        </div>
        <div class="grid" id="grid" role="grid"></div>
        <div class="legend" aria-hidden="true">
          <span><i class="dot event"></i>موعد</span>
          <span><i class="dot reminder"></i>تذكير</span>
        </div>
      </section>

      <section class="day" aria-labelledby="dayTitle">
        <div class="day-head">
          <h2 id="dayTitle"></h2>
          <span class="count" id="dayCount"></span>
        </div>
        <ul class="items" id="items"></ul>
        <div class="empty" id="empty" hidden>
          <div class="empty-art" aria-hidden="true">
            <svg viewBox="0 0 48 48"><rect x="7" y="10" width="34" height="31" rx="6"/><path d="M7 19h34M16 6v8M32 6v8"/><path d="M19 30l4 4 8-8"/></svg>
          </div>
          <p>لا يوجد شيء في هذا اليوم</p>
          <button type="button" class="btn soft" id="emptyAdd">أضف موعدًا أو تذكيرًا</button>
        </div>
      </section>
    </main>

    <button type="button" class="fab" id="fab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>إضافة</span>
    </button>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 id="sheetTitle">إضافة جديدة</h2>
      <button type="button" class="icon-btn" id="closeSheet" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <form id="form" novalidate autocomplete="off">
      <div class="sheet-body">
        <fieldset class="field">
          <legend class="label">ماذا تريد أن تضيف؟</legend>
          <div class="kind-grid">
            <label class="kind-card">
              <input type="radio" name="kind" value="event" checked>
              <span class="kind-icon event" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
              </span>
              <span class="kind-name">موعد</span>
              <span class="kind-desc">يظهر في التقويم في يومه</span>
            </label>
            <label class="kind-card">
              <input type="radio" name="kind" value="reminder">
              <span class="kind-icon reminder" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
              </span>
              <span class="kind-name">تذكير</span>
              <span class="kind-desc">مهمة نذكّرك بها في وقتها</span>
            </label>
          </div>
        </fieldset>

        <div class="field">
          <label class="label" for="title" id="titleLabel">ما هو الموعد؟</label>
          <input class="input" id="title" name="title" type="text" maxlength="80" enterkeyhint="done"
                 placeholder="مثال: اجتماع، زيارة، مناسبة" aria-describedby="titleError">
          <p class="error" id="titleError" hidden>اكتب عنوانًا قصيرًا أولًا</p>
        </div>

        <div class="field">
          <span class="label" id="whenLabel">متى؟</span>
          <div class="chips" id="dateChips" role="group" aria-labelledby="whenLabel"></div>
          <div class="row">
            <label class="mini">
              <span>اليوم</span>
              <input class="input" id="date" name="date" type="date" min="2000-01-01" max="2100-12-31" required>
            </label>
            <label class="mini">
              <span>الساعة</span>
              <input class="input" id="time" name="time" type="time" required>
            </label>
          </div>
          <p class="error" id="whenError" hidden>اختر يومًا وساعة صحيحة</p>
        </div>

        <fieldset class="field">
          <legend class="label">متى نذكّرك؟</legend>
          <div class="chips" id="remindChips"></div>
          <p class="hint" id="remindHint" hidden></p>
        </fieldset>

        <fieldset class="field">
          <legend class="label">التكرار</legend>
          <div class="chips" id="repeatChips"></div>
        </fieldset>

        <div class="field">
          <label class="label" for="note">ملاحظة <span class="optional">(اختياري)</span></label>
          <textarea class="input" id="note" name="note" rows="2" maxlength="300" placeholder="أي تفاصيل تريد تذكّرها"></textarea>
        </div>
      </div>
      <footer class="sheet-foot">
        <button type="submit" class="btn primary" id="saveBtn">حفظ</button>
        <button type="button" class="btn danger" id="deleteBtn" hidden>حذف</button>
      </footer>
    </form>
  </section>

  <div class="dialog-wrap" id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" hidden>
    <div class="dialog">
      <h3 id="confirmTitle">حذف هذا العنصر؟</h3>
      <p id="confirmText">لا يمكن التراجع عن الحذف.</p>
      <div class="dialog-actions">
        <button type="button" class="btn danger-fill" id="confirmYes">نعم، احذف</button>
        <button type="button" class="btn soft" id="confirmNo">إلغاء</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
